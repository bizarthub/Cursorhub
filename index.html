<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrickShop - Legos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">🧱 BrickShop</div>
    <button id="cart-btn" class="cart-btn">Carrito (<span id="cart-count">0</span>)</button>
  </header>

  <section class="hero">
    <h1>Legos para armar tu mundo</h1>
    <p>Sets originales, envíos a todo el país.</p>
  </section>

  <main>
    <p id="status" class="status">Cargando productos...</p>
    <div id="products" class="products"></div>
  </main>

  <aside id="cart" class="cart hidden">
    <h2>Tu carrito</h2>
    <ul id="cart-items"></ul>
    <p class="total">Total: <strong id="cart-total">$0</strong></p>
    <button id="cart-close" class="btn secondary">Cerrar</button>
  </aside>

  <footer>© 2026 BrickShop · Proyecto de prueba</footer>

  <script src="app.js"></script>
</body>
</html>
